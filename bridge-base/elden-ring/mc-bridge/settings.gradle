pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

rootProject.name = 'er-bridge'

// A Core-only build never configures optional character or Skills dependencies.
if (providers.gradleProperty('character').map { it.toBoolean() }.getOrElse(false)
        || providers.gradleProperty('b01').map { it.toBoolean() }.getOrElse(false)) {
    include 'character-bridge'
}
